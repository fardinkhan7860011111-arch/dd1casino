                          keyboardType: TextInputType.number,
                          decoration: InputDecoration(
                            filled: true,
                            fillColor: const Color(0xFF220808),
                            hintText: 'Enter Amount (Min ₹100)',
                            hintStyle: const TextStyle(color: Colors.white38),
                            border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: upiCtrl,
                          decoration: InputDecoration(
                            filled: true,
                            fillColor: const Color(0xFF220808),
                            hintText: 'Enter Your Receiving UPI ID (xyz@bank)',
                            hintStyle: const TextStyle(color: Colors.white38),
                            border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
                          ),
                        ),
                        const SizedBox(height: 16),
                        SizedBox(
                          width: double.infinity,
                          child: ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFF3366), padding: const EdgeInsets.symmetric(vertical: 14), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))),
                            onPressed: () {
                              double req = double.tryParse(amtCtrl.text) ?? 0.0;
                              if (req < 100) {
                                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Minimum withdrawal is ₹100')));
                                return;
                              }
                              if (req > _balance) {
                                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Insufficient balance!')));
                                return;
                              }
                              if (!upiCtrl.text.contains('@')) {
                                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Enter a valid UPI ID!')));
                                return;
                              }
                              HapticFeedback.heavyImpact();
                              _saveWallet(_balance - req);
                              Navigator.pop(ctx);
                              ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Withdrawal Initiated! Transferred within 15 mins.')));
                            },
                            child: const Text('CASHOUT TO UPI', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
