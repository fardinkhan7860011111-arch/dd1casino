name: DD1 Production Master Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Full Production Gaming App
        run: |
          flutter create --platforms=android --org com.dd1.vip app
          cd app
          flutter pub add shared_preferences

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            runApp(const DD1App());
          }

          const String ADMIN_UPI = "fardinkhan7860011111@okhdfcbank";

          class DD1App extends StatelessWidget {
            const DD1App({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'DD1.COM VIP',
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF130103),
                  primaryColor: const Color(0xFFFFD700),
                ),
                home: const AuthScreen(),
              );
            }
          }

          class AuthScreen extends StatefulWidget {
            const AuthScreen({super.key});
            @override
            State<AuthScreen> createState() => _AuthScreenState();
          }

          class _AuthScreenState extends State<AuthScreen> {
            final eCtrl = TextEditingController();

            Future<void> _login() async {
              final em = eCtrl.text.trim();
              if (!em.contains('@')) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Enter a valid Gmail')));
                return;
              }
              HapticFeedback.heavyImpact();
              final prefs = await SharedPreferences.getInstance();
              await prefs.setString('email', em);
              if (!prefs.containsKey('bal_$em')) await prefs.setDouble('bal_$em', 100.0);
              Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => LobbyScreen(email: em)));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Container(
                  padding: const EdgeInsets.all(24),
                  decoration: const BoxDecoration(
                    gradient: LinearGradient(colors: [Color(0xFF4C040B), Color(0xFF130103)], begin: Alignment.topCenter, end: Alignment.bottomCenter),
                  ),
                  child: Center(
                    child: Column(
                      mainAxisAlignment: MainAxisAlignment.center,
                      children: [
                        const Icon(Icons.stars, color: Color(0xFFFFD700), size: 75),
                        const SizedBox(height: 8),
                        const Text('DD1.COM', style: TextStyle(color: Color(0xFFFFD700), fontSize: 36, fontWeight: FontWeight.w900, letterSpacing: 2)),
                        const Text('REAL MONEY GAMING SUITE', style: TextStyle(color: Colors.white54, fontSize: 11)),
                        const SizedBox(height: 40),
                        TextField(controller: eCtrl, decoration: const InputDecoration(hintText: 'Enter your Gmail ID', filled: true, fillColor: Color(0xFF170204))),
                        const SizedBox(height: 14),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700), minimumSize: const Size(double.infinity, 50)),
                          onPressed: _login,
                          child: const Text('SIGN IN & START EARNING', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }
          }

          class LobbyScreen extends StatefulWidget {
            final String email;
            const LobbyScreen({super.key, required this.email});
            @override
            State<LobbyScreen> createState() => _LobbyScreenState();
          }

          class _LobbyScreenState extends State<LobbyScreen> {
            double bal = 100.0;

            @override
            void initState() {
              super.initState();
              _load();
            }

            Future<void> _load() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() => bal = prefs.getDouble('bal_${widget.email}') ?? 100.0);
            }

            Future<void> _set(double v) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setDouble('bal_${widget.email}', v);
              setState(() => bal = v);
            }

            void _deposit() {
              final utr = TextEditingController();
              final qr = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=upi://pay?pa=$ADMIN_UPI%26pn=Fardin%20Khan%26cu=INR";
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF280306),
                isScrollControlled: true,
                builder: (c) => Padding(
                  padding: EdgeInsets.only(bottom: MediaQuery.of(c).viewInsets.bottom, left: 20, right: 20, top: 20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('INSTANT UPI DEPOSIT', style: TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold, fontSize: 16)),
                      const SizedBox(height: 10),
                      Container(color: Colors.white, padding: const EdgeInsets.all(8), child: Image.network(qr, height: 160, width: 160)),
                      const SizedBox(height: 10),
                      Text(ADMIN_UPI, style: const TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold)),
                      const SizedBox(height: 10),
                      TextField(controller: utr, decoration: const InputDecoration(hintText: 'Enter 12-Digit UTR', filled: true, fillColor: Color(0xFF130103))),
                      const SizedBox(height: 10),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.green, minimumSize: const Size(double.infinity, 46)),
                        onPressed: () {
                          if (utr.text.length >= 6) {
                            _set(bal + 500);
                            Navigator.pop(c);
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('₹500 Deposit Added!')));
                          }
                        },
                        child: const Text('SUBMIT UTR', style: TextStyle(fontWeight: FontWeight.bold)),
                      ),
                      const SizedBox(height: 20),
                    ],
                  ),
                ),
              );
            }

            void _withdraw() {
              Navigator.push(context, MaterialPageRoute(builder: (_) => WithdrawScreen(bal: bal, email: widget.email, onOut: (a) => _set(bal - a))));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF280306),
                  title: Text('DD1: ${widget.email}', style: const TextStyle(color: Color(0xFFFFD700), fontSize: 13)),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(color: const Color(0xFF280306), borderRadius: BorderRadius.circular(12)),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                            const Text('Your Wallet Balance', style: TextStyle(fontSize: 11, color: Colors.white54)),
                            Text('₹ ${bal.toStringAsFixed(2)}', style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Color(0xFFFFD700))),
                          ]),
                          Row(children: [
                            ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.green), onPressed: _deposit, child: const Text('Deposit')),
                            const SizedBox(width: 6),
                            ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.red), onPressed: _withdraw, child: const Text('Withdraw')),
                          ])
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    GridView.count(
                      crossAxisCount: 2,
                      shrinkWrap: true,
                      physics: const NeverScrollableScrollPhysics(),
                      crossAxisSpacing: 10,
                      mainAxisSpacing: 10,
                      children: [
                        _gameCard('AVIATOR 🚀', Colors.red, () async {
                          final r = await Navigator.push(context, MaterialPageRoute(builder: (_) => AviatorGame(bal: bal)));
                          if (r != null) _set(r);
                        }),
                        _gameCard('MINES PRO 💎', Colors.blue, () async {
                          final r = await Navigator.push(context, MaterialPageRoute(builder: (_) => MinesGame(bal: bal)));
                          if (r != null) _set(r);
                        }),
                        _gameCard('7 UP 7 DOWN 🎲', Colors.amber, () async {
                          final r = await Navigator.push(context, MaterialPageRoute(builder: (_) => SevenUpDownGame(bal: bal)));
                          if (r != null) _set(r);
                        }),
                        _gameCard('FORTUNE GEMS 🎰', Colors.green, () async {
                          final r = await Navigator.push(context, MaterialPageRoute(builder: (_) => FortuneGemsGame(bal: bal)));
                          if (r != null) _set(r);
                        }),
                      ],
                    ),
                  ],
                ),
              );
            }

            Widget _gameCard(String title, Color c, VoidCallback onTap) {
              return InkWell(
                onTap: onTap,
                child: Container(
                  decoration: BoxDecoration(color: c.withOpacity(0.3), borderRadius: BorderRadius.circular(10), border: Border.all(color: Colors.white12)),
                  child: Center(child: Text(title, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13))),
                ),
              );
            }
          }

          class WithdrawScreen extends StatefulWidget {
            final double bal;
            final String email;
            final Function(double) onOut;
            const WithdrawScreen({super.key, required this.bal, required this.email, required this.onOut});
            @override
            State<WithdrawScreen> createState() => _WithdrawScreenState();
          }

          class _WithdrawScreenState extends State<WithdrawScreen> {
            final chips = [110, 300, 500, 1000, 2000, 5000];
            double sel = 110;

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: const Text('Withdrawal'), backgroundColor: const Color(0xFF280306)),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Text('Withdrawable Balance: ₹${widget.bal.toStringAsFixed(2)}', style: const TextStyle(fontSize: 16, color: Color(0xFFFFD700), fontWeight: FontWeight.bold)),
                    const SizedBox(height: 16),
                    Wrap(
                      spacing: 8,
                      runSpacing: 8,
                      children: chips.map((c) => InkWell(
                        onTap: () => setState(() => sel = c.toDouble()),
                        child: Container(
                          width: 100,
                          padding: const EdgeInsets.all(12),
                          decoration: BoxDecoration(color: sel == c ? const Color(0xFF800C17) : const Color(0xFF280306), border: Border.all(color: sel == c ? const Color(0xFFFFD700) : Colors.white12)),
                          child: Center(child: Text('₹$c', style: const TextStyle(fontWeight: FontWeight.bold)))),
                        ),
                      )).toList(),
                    ),
                    const SizedBox(height: 24),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700), minimumSize: const Size(double.infinity, 48)),
                      onPressed: () {
                        if (sel <= widget.bal) {
                          widget.onOut(sel);
                          Navigator.pop(context);
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Withdrawal Request Sent!')));
                        } else {
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Insufficient Balance!')));
                        }
                      },
                      child: const Text('Withdraw Payout', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                    ),
                  ],
                ),
              );
            }
          }

          class AviatorGame extends StatefulWidget {
            final double bal;
            const AviatorGame({super.key, required this.bal});
            @override
            State<AviatorGame> createState() => _AviatorGameState();
          }

          class _AviatorGameState extends State<AviatorGame> {
            late double w;
            double m = 1.0;
            bool fly = false;
            Timer? t;
            @override
            void initState() { super.initState(); w = widget.bal; }
            void _start() {
              if (w < 50) return;
              setState(() { w -= 50; fly = true; m = 1.0; });
              double crash = 1.2 + Random().nextDouble() * 4.0;
              t?.cancel();
              t = Timer.periodic(const Duration(milliseconds: 50), (tm) {
                setState(() {
                  m += 0.03;
                  if (m >= crash) { tm.cancel(); fly = false; }
                });
              });
            }
            void _cash() {
              if (!fly) return;
              t?.cancel();
              setState(() { fly = false; w += (50 * m); });
            }
            @override
            void dispose() { t?.cancel(); super.dispose(); }
            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async { Navigator.pop(context, w); return false; },
                child: Scaffold(
                  appBar: AppBar(title: const Text('AVIATOR 🚀'), backgroundColor: const Color(0xFF280306)),
                  body: Column(
                    children: [
                      Expanded(child: Center(child: Text('${m.toStringAsFixed(2)}x', style: TextStyle(fontSize: 60, fontWeight: FontWeight.bold, color: fly ? const Color(0xFFFFD700) : Colors.white30)))),
                      Padding(
                        padding: const EdgeInsets.all(20),
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: fly ? const Color(0xFFFFD700) : Colors.green, minimumSize: const Size(double.infinity, 50)),
                          onPressed: fly ? _cash : _start,
                          child: Text(fly ? 'CASHOUT ₹${(50 * m).toStringAsFixed(0)}' : 'BET ₹50', style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                        ),
                      )
                    ],
                  ),
                ),
              );
            }
          }

          class MinesGame extends StatefulWidget {
            final double bal;
            const MinesGame({super.key, required this.bal});
            @override
            State<MinesGame> createState() => _MinesGameState();
          }

          class _MinesGameState extends State<MinesGame> {
            late double w;
            List<bool> bomb = List.filled(25, false);
            List<bool> rev = List.filled(25, false);
            bool act = false;
            double mult = 1.0;
            @override
            void initState() { super.initState(); w = widget.bal; }
            void _start() {
              if (w < 50) return;
              setState(() {
                w -= 50; act = true; mult = 1.0;
                bomb = List.filled(25, false); rev = List.filled(25, false);
                int p = 0;
                while(p < 3) { int i = Random().nextInt(25); if(!bomb[i]) { bomb[i] = true; p++; } }
              });
            }
            void _tap(int i) {
              if(!act || rev[i]) return;
              setState(() {
                rev[i] = true;
                if(bomb[i]) { act = false; rev = List.filled(25, true); }
                else { mult += 0.35; }
              });
            }
            void _cash() {
              if(!act) return;
              setState(() { act = false; w += (50 * mult); rev = List.filled(25, true); });
            }
            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async { Navigator.pop(context, w); return false; },
                child: Scaffold(
                  appBar: AppBar(title: const Text('MINES PRO 💎'), backgroundColor: const Color(0xFF280306)),
                  body: Column(
                    children: [
                      Expanded(
                        child: GridView.builder(
                          padding: const EdgeInsets.all(16),
                          gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 5, crossAxisSpacing: 6, mainAxisSpacing: 6),
                          itemCount: 25,
                          itemBuilder: (c, i) => GestureDetector(
                            onTap: () => _tap(i),
                            child: Container(
                              decoration: BoxDecoration(color: rev[i] ? (bomb[i] ? Colors.red : Colors.green) : const Color(0xFF280306), borderRadius: BorderRadius.circular(6)),
                              child: Center(child: Text(rev[i] ? (bomb[i] ? '💣' : '💎') : '')),
                            ),
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.all(20),
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: act ? const Color(0xFFFFD700) : Colors.green, minimumSize: const Size(double.infinity, 50)),
                          onPressed: act ? _cash : _start,
                          child: Text(act ? 'CASHOUT ₹${(50 * mult).toStringAsFixed(2)}' : 'START ₹50', style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                        ),
                      )
                    ],
                  ),
                ),
              );
            }
          }

          class SevenUpDownGame extends StatefulWidget {
            final double bal;
            const SevenUpDownGame({super.key, required this.bal});
            @override
            State<SevenUpDownGame> createState() => _SevenUpDownGameState();
          }

          class _SevenUpDownGameState extends State<SevenUpDownGame> {
            late double w;
            @override
            void initState() { super.initState(); w = widget.bal; }
            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async { Navigator.pop(context, w); return false; },
                child: Scaffold(
                  appBar: AppBar(title: const Text('7 UP 7 DOWN 🎲'), backgroundColor: const Color(0xFF280306)),
                  body: Center(
                    child: ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700)),
                      onPressed: () => setState(() => w += 100),
                      child: Text('WIN ₹100 (Bal: ₹$w)', style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                    ),
                  ),
                ),
              );
            }
          }

          class FortuneGemsGame extends StatefulWidget {
            final double bal;
            const FortuneGemsGame({super.key, required this.bal});
            @override
            State<FortuneGemsGame> createState() => _FortuneGemsGameState();
          }

          class _FortuneGemsGameState extends State<FortuneGemsGame> {
            late double w;
            @override
            void initState() { super.initState(); w = widget.bal; }
            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async { Navigator.pop(context, w); return false; },
                child: Scaffold(
                  appBar: AppBar(title: const Text('FORTUNE GEMS 🎰'), backgroundColor: const Color(0xFF280306)),
                  body: Center(
                    child: ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700)),
                      onPressed: () => setState(() => w += 150),
                      child: Text('SPIN & WIN ₹150 (Bal: ₹$w)', style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

          flutter build apk --release --no-tree-shake-icons

      - name: Upload DD1 Final APK
        uses: actions/upload-artifact@v4
        with:
          name: dd1casino-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
