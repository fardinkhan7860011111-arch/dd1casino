name: DD1 VIP Casino

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter App
        run: |
          flutter create --platforms=android --org com.dd1.vip app
          cd app

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            runApp(const DD1App());
          }

          const String ADMIN_UPI = "fardinkhan7860011111@okhdfcbank";

          class DD1App extends StatelessWidget {
            const DD1App({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0D0505),
                  primaryColor: const Color(0xFFFFD700),
                ),
                home: const Lobby(),
              );
            }
          }

          class Lobby extends StatefulWidget {
            const Lobby({super.key});
            @override
            State<Lobby> createState() => _LobbyState();
          }

          class _LobbyState extends State<Lobby> {
            static double bal = 0.0;
            static bool claimed = false;
            final wins = ["🔥 VIP_9410 won ₹4,800 on Aviator", "💰 VIP_2104 cashed ₹10,000 via UPI", "💎 VIP_6711 opened 7 Diamonds"];
            int wIdx = 0;
            Timer? t;

            @override
            void initState() {
              super.initState();
              t = Timer.periodic(const Duration(seconds: 4), (timer) {
                if (mounted) setState(() => wIdx = (wIdx + 1) % wins.length);
              });
              if (!claimed) {
                WidgetsBinding.instance.addPostFrameCallback((_) => _bonus());
              }
            }

            @override
            void dispose() {
              t?.cancel();
              super.dispose();
            }

            void _bonus() {
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (c) => AlertDialog(
                  backgroundColor: const Color(0xFF1F0A0A),
                  title: const Text('🎁 ₹50 VIP BONUS', style: TextStyle(color: Color(0xFFFFD700))),
                  content: const Text('Exclusive join bonus to play Aviator and Mines!'),
                  actions: [
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700)),
                      onPressed: () {
                        HapticFeedback.mediumImpact();
                        setState(() {
                          claimed = true;
                          bal += 50;
                        });
                        Navigator.pop(c);
                      },
                      child: const Text('CLAIM ₹50', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
                    )
                  ],
                ),
              );
            }

            void _deposit() {
              final utr = TextEditingController();
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: const Color(0xFF140505),
                builder: (c) => Padding(
                  padding: EdgeInsets.only(bottom: MediaQuery.of(c).viewInsets.bottom, left: 16, right: 16, top: 16),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Text('DEPOSIT VIA UPI QR', style: TextStyle(color: Color(0xFFFFD700), fontSize: 16, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 12),
                      Container(
                        padding: const EdgeInsets.all(10),
                        color: Colors.white,
                        child: CustomPaint(size: const Size(140, 140), painter: QRPainter()),
                      ),
                      const SizedBox(height: 10),
                      Text(ADMIN_UPI, style: const TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold)),
                      const SizedBox(height: 10),
                      TextField(controller: utr, decoration: const InputDecoration(hintText: 'Enter 12-Digit UTR', filled: true)),
                      const SizedBox(height: 10),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: Colors.green),
                        onPressed: () {
                          if (utr.text.length >= 6) {
                            HapticFeedback.mediumImpact();
                            setState(() => bal += 500);
                            Navigator.pop(c);
                            ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Deposit Submitted!')));
                          }
                        },
                        child: const Text('SUBMIT UTR'),
                      ),
                      const SizedBox(height: 20),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF140505),
                  title: const Text('DD1 VIP CASINO', style: TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold)),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(10),
                      color: const Color(0xFF1C0808),
                      child: Text(wins[wIdx], style: const TextStyle(color: Colors.amberAccent, fontSize: 12, fontWeight: FontWeight.bold)),
                    ),
                    const SizedBox(height: 16),
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(color: const Color(0xFF220808), borderRadius: BorderRadius.circular(12)),
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Text('₹ ${bal.toStringAsFixed(2)}', style: const TextStyle(fontSize: 26, color: Color(0xFFFFD700), fontWeight: FontWeight.bold)),
                          ElevatedButton(style: ElevatedButton.styleFrom(backgroundColor: Colors.green), onPressed: _deposit, child: const Text('DEPOSIT')),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1F0808), padding: const EdgeInsets.all(16)),
                      onPressed: () async {
                        final r = await Navigator.push(context, MaterialPageRoute(builder: (_) => Aviator(b: bal)));
                        if (r != null) setState(() => bal = r);
                      },
                      child: const Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [Text('AVIATOR 🚀', style: TextStyle(fontWeight: FontWeight.bold)), Icon(Icons.play_arrow, color: Color(0xFFFFD700))]),
                    ),
                    const SizedBox(height: 12),
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF1F0808), padding: const EdgeInsets.all(16)),
                      onPressed: () async {
                        final r = await Navigator.push(context, MaterialPageRoute(builder: (_) => Mines(b: bal)));
                        if (r != null) setState(() => bal = r);
                      },
                      child: const Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [Text('MINES PRO 💎', style: TextStyle(fontWeight: FontWeight.bold)), Icon(Icons.play_arrow, color: Color(0xFFFFD700))]),
                    ),
                  ],
                ),
              );
            }
          }

          class Aviator extends StatefulWidget {
            final double b;
            const Aviator({super.key, required this.b});
            @override
            State<Aviator> createState() => _AviatorState();
          }

          class _AviatorState extends State<Aviator> {
            late double cur;
            double m = 1.0;
            bool fly = false;
            Timer? timer;

            @override
            void initState() {
              super.initState();
              cur = widget.b;
            }

            void _start() {
              if (cur < 50) return;
              HapticFeedback.mediumImpact();
              setState(() {
                cur -= 50;
                fly = true;
                m = 1.0;
              });
              double c = 1.2 + Random().nextDouble() * 5;
              timer?.cancel();
              timer = Timer.periodic(const Duration(milliseconds: 65), (tm) {
                setState(() {
                  m += 0.04;
                  if (m >= c) {
                    tm.cancel();
                    fly = false;
                    HapticFeedback.heavyImpact();
                  }
                });
              });
            }

            void _cashout() {
              if (!fly) return;
              timer?.cancel();
              HapticFeedback.mediumImpact();
              setState(() {
                fly = false;
                cur += (50 * m);
              });
            }

            @override
            void dispose() {
              timer?.cancel();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  Navigator.pop(context, cur);
                  return false;
                },
                child: Scaffold(
                  appBar: AppBar(title: const Text('AVIATOR 🚀'), backgroundColor: const Color(0xFF140505)),
                  body: Column(
                    children: [
                      Expanded(child: Center(child: Text('${m.toStringAsFixed(2)}x', style: TextStyle(fontSize: 52, fontWeight: FontWeight.bold, color: fly ? Colors.redAccent : Colors.white38)))),
                      Padding(
                        padding: const EdgeInsets.all(20),
                        child: SizedBox(
                          width: double.infinity,
                          height: 50,
                          child: ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: fly ? Colors.amber : Colors.green),
                            onPressed: fly ? _cashout : _start,
                            child: Text(fly ? 'CASHOUT ₹${(50 * m).toStringAsFixed(0)}' : 'BET ₹50', style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 18)),
                          ),
                        ),
                      )
                    ],
                  ),
                ),
              );
            }
          }

          class Mines extends StatefulWidget {
            final double b;
            const Mines({super.key, required this.b});
            @override
            State<Mines> createState() => _MinesState();
          }

          class _MinesState extends State<Mines> {
            late double cur;
            List<bool> m = List.filled(25, false);
            List<bool> r = List.filled(25, false);
            bool act = false;
            double mult = 1.0;

            @override
            void initState() {
              super.initState();
              cur = widget.b;
            }

            void _start() {
              if (cur < 50) return;
              HapticFeedback.mediumImpact();
              setState(() {
                cur -= 50;
                act = true;
                mult = 1.0;
                r = List.filled(25, false);
                m = List.filled(25, false);
                int p = 0;
                while (p < 3) {
                  int rand = Random().nextInt(25);
                  if (!m[rand]) {
                    m[rand] = true;
                    p++;
                  }
                }
              });
            }

            void _tap(int i) {
              if (!act || r[i]) return;
              HapticFeedback.selectionClick();
              setState(() {
                r[i] = true;
                if (m[i]) {
                  act = false;
                  HapticFeedback.heavyImpact();
                  r = List.filled(25, true);
                } else {
                  mult += 0.35;
                }
              });
            }

            void _cashout() {
              if (!act) return;
              HapticFeedback.mediumImpact();
              setState(() {
                act = false;
                cur += (50 * mult);
                r = List.filled(25, true);
              });
            }

            @override
            Widget build(BuildContext context) {
              return WillPopScope(
                onWillPop: () async {
                  Navigator.pop(context, cur);
                  return false;
                },
                child: Scaffold(
                  appBar: AppBar(title: const Text('MINES PRO 💎'), backgroundColor: const Color(0xFF140505)),
                  body: Column(
                    children: [
                      Expanded(
                        child: GridView.builder(
                          padding: const EdgeInsets.all(20),
                          gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 5, crossAxisSpacing: 8, mainAxisSpacing: 8),
                          itemCount: 25,
                          itemBuilder: (c, i) => GestureDetector(
                            onTap: () => _tap(i),
                            child: Container(
                              decoration: BoxDecoration(color: r[i] ? (m[i] ? Colors.red : Colors.amber) : const Color(0xFF220808), borderRadius: BorderRadius.circular(8)),
                              child: Center(child: Text(r[i] ? (m[i] ? '💣' : '💎') : '', style: const TextStyle(fontSize: 22))),
                            ),
                          ),
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.all(20),
                        child: SizedBox(
                          width: double.infinity,
                          height: 50,
                          child: ElevatedButton(
                            style: ElevatedButton.styleFrom(backgroundColor: act ? Colors.amber : Colors.green),
                            onPressed: act ? _cashout : _start,
                            child: Text(act ? 'CASHOUT ₹${(50 * mult).toStringAsFixed(2)}' : 'START ₹50', style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 16)),
                          ),
                        ),
                      )
                    ],
                  ),
                ),
              );
            }
          }

          class QRPainter extends CustomPainter {
            @override
            void paint(Canvas canvas, Size size) {
              final paint = Paint()..color = Colors.black..style = PaintingStyle.fill;
              double block = size.width / 11;
              for (int r = 0; r < 11; r++) {
                for (int c = 0; c < 11; c++) {
                  if ((r < 4 && c < 4) || (r < 4 && c > 6) || (r > 6 && c < 4) || (r == 5 && c % 2 == 0) || (c == 5 && r % 2 == 0) || ((r * c) % 3 == 0)) {
                    canvas.drawRect(Rect.fromLTWH(c * block, r * block, block, block), paint);
                  }
                }
              }
            }
            @override
            bool shouldRepaint(covariant CustomPainter oldDelegate) => false;
          }
          EOF

          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dd1casino-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          
