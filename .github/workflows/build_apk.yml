name: DD1 VIP Casino Ultimate Suite

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Full Production APK
        run: |
          flutter create --platforms=android --org com.dd1.vip app
          cd app

          # Add production dependencies
          flutter pub add qr_flutter shared_preferences flutter_launcher_icons

          # Generate Gold VIP Crown Icon
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (512, 512), color='#0A0404')
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([(16, 16), (496, 496)], radius=95, fill='#170707', outline='#FFD700', width=16)
          crown = [(120, 340), (120, 230), (180, 280), (256, 170), (332, 280), (392, 230), (392, 340)]
          draw.polygon(crown, fill='#FFD700')
          draw.rectangle([(120, 350), (392, 375)], fill='#FFD700')
          for pt in [(120, 215), (256, 155), (392, 215)]:
              draw.ellipse([(pt[0]-14, pt[1]-14), (pt[0]+14, pt[1]+14)], fill='#FFFFFF')
          img.save('icon.png')
          "

          cat << 'EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "launcher_icon"
            ios: false
            image_path: "icon.png"
            adaptive_icon_background: "#0A0404"
            adaptive_icon_foreground: "icon.png"
          EOF

          flutter pub run flutter_launcher_icons

          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:qr_flutter/qr_flutter.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);
            runApp(const DD1VIPSuite());
          }

          const String ADMIN_UPI = "fardinkhan7860011111@okhdfcbank";
          const String MERCHANT_NAME = "DD1 VIP GAMING";

          class DD1VIPSuite extends StatelessWidget {
            const DD1VIPSuite({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'DD1 VIP CASINO',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF080303),
                  primaryColor: const Color(0xFFFFD700),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFFFD700),
                    secondary: Color(0xFFFF3366),
                  ),
                ),
                home: const SuperLobby(),
              );
            }
          }

          class SuperLobby extends StatefulWidget {
            const SuperLobby({super.key});
            @override
            State<SuperLobby> createState() => _SuperLobbyState();
          }

          class _SuperLobbyState extends State<SuperLobby> {
            double _balance = 0.0;
            double _turnover = 0.0;
            bool _bonusClaimed = false;
            int _lastSpinDay = 0;
            final String _userId = "VIP_${Random().nextInt(899999) + 100000}";

            final List<String> _liveTicker = [
              "🔥 VIP_9410 cashed ₹4,800 on Aviator (3.42x)",
              "💰 VIP_2104 withdrawn ₹10,000 via IMPS UPI",
              "💎 VIP_6711 opened 7 Diamonds on Mines (+₹3,150)",
              "⚡ VIP_5019 added ₹2,000 to Wallet",
              "👑 VIP_8890 unlocked Gold VIP Status"
            ];
            int _tickerIdx = 0;
            Timer? _tickerTimer;

            @override
            void initState() {
              super.initState();
              _loadPersistedData();
              _tickerTimer = Timer.periodic(const Duration(seconds: 4), (t) {
                if (mounted) setState(() => _tickerIdx = (_tickerIdx + 1) % _liveTicker.length);
              });
            }

            @override
            void dispose() {
              _tickerTimer?.cancel();
              super.dispose();
            }

            Future<void> _loadPersistedData() async {
              final prefs = await SharedPreferences.getInstance();
              setState(() {
                _bonusClaimed = prefs.getBool('bonus_claimed') ?? false;
                _balance = prefs.getDouble('wallet_bal') ?? 0.0;
                _turnover = prefs.getDouble('turnover_xp') ?? 0.0;
                _lastSpinDay = prefs.getInt('last_spin_day') ?? 0;
              });

              if (!_bonusClaimed) {
                WidgetsBinding.instance.addPostFrameCallback((_) => _showWelcomeDialog());
              }
            }

            Future<void> _saveWallet(double newBal, [double xpAdd = 0.0]) async {
              final prefs = await SharedPreferences.getInstance();
              final double updatedTurnover = _turnover + xpAdd;
              await prefs.setDouble('wallet_bal', newBal);
              await prefs.setDouble('turnover_xp', updatedTurnover);
              setState(() {
                _balance = newBal;
                _turnover = updatedTurnover;
              });
            }

            String _getVipTier() {
              if (_turnover > 15000) return "PLATINUM VIP";
              if (_turnover > 5000) return "GOLD VIP";
              if (_turnover > 1500) return "SILVER VIP";
              return "BRONZE VIP";
            }

            void _showWelcomeDialog() {
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1C0808),
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(24),
                    side: const BorderSide(color: Color(0xFFFFD700), width: 1.5),
                  ),
                  title: const Column(
                    children: [
                      Icon(Icons.military_tech, color: Color(0xFFFFD700), size: 55),
                      SizedBox(height: 8),
                      Text('VIP WELCOME CHIP', style: TextStyle(color: Color(0xFFFFD700), fontWeight: FontWeight.bold, fontSize: 18)),
                    ],
                  ),
                  content: const Text(
                    'Exclusive ₹50 Join Bonus is waiting!\nUse it to play Aviator and Mines.',
                    textAlign: TextAlign.center,
                    style: TextStyle(color: Colors.white70),
                  ),
                  actions: [
                    SizedBox(
                      width: double.infinity,
                      child: ElevatedButton(
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700), padding: const EdgeInsets.symmetric(vertical: 14), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))),
                        onPressed: () async {
                          HapticFeedback.heavyImpact();
                          final prefs = await SharedPreferences.getInstance();
                          await prefs.setBool('bonus_claimed', true);
                          await _saveWallet(_balance + 50.0);
                          setState(() => _bonusClaimed = true);
                          Navigator.pop(ctx);
                        },
                        child: const Text('CLAIM ₹50 FREE', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold, fontSize: 16)),
                      ),
                    )
                  ],
                ),
              );
            }

            void _openDailyWheel() {
              final currentDay = DateTime.now().day;
              if (currentDay == _lastSpinDay) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Daily reward already claimed today! Come back tomorrow.')));
                return;
              }

              final prizes = [20.0, 50.0, 10.0, 100.0, 30.0];
              final wonPrize = prizes[Random().nextInt(prizes.length)];

              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E0909),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(20), side: const BorderSide(color: Color(0xFFFFD700))),
                  title: const Text('🎁 DAILY VIP REWARD', textAlign: TextAlign.center, style: TextStyle(color: Color(0xFFFFD700))),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Icon(Icons.casino, size: 64, color: Colors.amber),
                      const SizedBox(height: 12),
                      Text('YOU WON ₹${wonPrize.toStringAsFixed(0)}!', style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.white)),
                      const SizedBox(height: 6),
                      const Text('Added directly to your balance.', style: TextStyle(color: Colors.white54, fontSize: 13)),
                    ],
                  ),
                  actions: [
                    ElevatedButton(
                      style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFFFD700)),
                      onPressed: () async {
                        HapticFeedback.mediumImpact();
                        final prefs = await SharedPreferences.getInstance();
                        await prefs.setInt('last_spin_day', currentDay);
                        setState(() => _lastSpinDay = currentDay);
                        await _saveWallet(_balance + wonPrize);
                        Navigator.pop(ctx);
                      },
                      child: const Center(child: Text('CLAIM TO WALLET', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold))),
                    )
                  ],
                ),
              );
            }

            void _openDepositModal() {
              final utrCtrl = TextEditingController();
              final upiUrl = "upi://pay?pa=$ADMIN_UPI&pn=$MERCHANT_NAME&cu=INR";

              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: const Color(0xFF140505),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(25))),
                builder: (ctx) => Padding(
                  padding: EdgeInsets.only(bottom: MediaQuery.of(ctx).viewInsets.bottom, left: 20, right: 20, top: 20),
                  child: SingleChildScrollView(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Container(width: 40, height: 4, decoration: BoxDecoration(color: Colors.white24, borderRadius: BorderRadius.circular(2))),
                        const SizedBox(height: 14),
                        const Text('SCAN WITH ANY UPI APP', style: TextStyle(color: Color(0xFFFFD700), fontSize: 16, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 14),
                        Container(
                          padding: const EdgeInsets.all(12),
